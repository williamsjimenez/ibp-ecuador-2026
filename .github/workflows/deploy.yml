name: Publicar Atlas IBP Ecuador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar atlas estatico
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
